name: Check sensitive tracked files
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-sensitive-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check tracked runtime files and recognized secrets
        run: python scripts/check_sensitive_files.py
